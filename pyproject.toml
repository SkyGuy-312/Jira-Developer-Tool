[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-developer-tool"
version = "0.2.0"
description = "Jira from the terminal for developers: an interactive daily check-in that keeps your tickets updated, plus a read layer that renders a whole ticket as markdown and serves it to AI agents over MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jira-tool = "jira_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
