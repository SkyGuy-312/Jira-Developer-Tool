[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-developer-tool"
version = "0.1.2"
description = "Interactive daily check-in CLI that keeps your Jira tickets updated: comments, worklogs, and closing with resolutions."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.28",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jira-tool = "jira_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
